# Dify Community Edition - 实验室安全小助手专用部署
# 参考: https://github.com/langgenius/dify
version: '3.8'

services:
  # ========== 基础设施 ==========
  postgres:
    image: postgres:15-alpine
    container_name: dify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dify-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ 消息队列（Dify worker 需要）
  rabbitmq:
    image: rabbitmq:3.12-alpine
    container_name: dify-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Weaviate 向量数据库（Dify 知识库索引存储）
  weaviate:
    image: semitechnologies/weaviate:1.24.9
    container_name: dify-weaviate
    restart: unless-stopped
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dify Plugin Daemon（插件系统）
  dify-plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.1.0-local
    container_name: dify-plugin-daemon
    restart: unless-stopped
    environment:
      DB_TYPE: postgresql
      DB_USERNAME: dify
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify
      SERVER_PORT: "5002"
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgNRPbUcHjXey5s2DgM=}
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgNRPbUcHjXey5s2DgM=}
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgNRPbUcHjXey5s2DgM=}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: "5003"
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PIP_MIRROR_URL: ${PIP_MIRROR_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PYTHON_ENV_INIT_TIMEOUT: "300"
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy

  # ========== Dify 核心服务 ==========
  dify-api:
    image: langgenius/dify-api:1.0.1
    container_name: dify-api
    restart: unless-stopped
    environment:
      # 运行模式
      MODE: api
      # 数据库
      DB_TYPE: postgresql
      DB_USERNAME: dify
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # RabbitMQ
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      # 向量数据库
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      # 密钥
      SECRET_KEY: ${SECRET_KEY:-sk-9f73s2ljb8a4k5e7d1c0h3g6m9n2p5r}
      # 存储
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: storage
      # 日志
      LOG_LEVEL: INFO
      # 初始化
      INIT_PASSWORD: ${INIT_PASSWORD:-admin123456}
      # 控制台/API 地址
      CONSOLE_WEB_URL: http://localhost:8081
      CONSOLE_API_URL: http://localhost:8081
      SERVICE_API_URL: http://localhost:8080
      # Plugin Daemon
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgNRPbUcHjXey5s2DgM=}
      PLUGIN_REMOTE_INSTALL_HOST: dify-plugin-daemon
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
      # 邮件（开发环境可禁用）
      MAIL_TYPE: ''
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started
    ports:
      - "5001:5001"

  dify-worker:
    image: langgenius/dify-api:1.0.1
    container_name: dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      DB_TYPE: postgresql
      DB_USERNAME: dify
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      SECRET_KEY: ${SECRET_KEY:-sk-9f73s2ljb8a4k5e7d1c0h3g6m9n2p5r}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: storage
      LOG_LEVEL: INFO
      MAIL_TYPE: ''
      PLUGIN_DAEMON_URL: http://dify-plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgNRPbUcHjXey5s2DgM=}
      PLUGIN_REMOTE_INSTALL_HOST: dify-plugin-daemon
      PLUGIN_REMOTE_INSTALL_PORT: "5003"
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dify-plugin-daemon:
        condition: service_started

  dify-web:
    image: langgenius/dify-web:1.0.1
    container_name: dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: http://localhost:8081
      APP_API_URL: http://localhost:8080
      MARKETPLACE_URL: https://marketplace.dify.ai
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      NEXT_PUBLIC_DEPLOY_ENV: DEVELOPMENT
    depends_on:
      - dify-api

  # Nginx 反向代理（统一入口）
  nginx:
    image: nginx:alpine
    container_name: dify-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # Dify Service API（程序调用）
      - "8081:8081" # Dify Console Web（管理界面）
    depends_on:
      - dify-api
      - dify-web

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  weaviate_data:
  dify_storage:
