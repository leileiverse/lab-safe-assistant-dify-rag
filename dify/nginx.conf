server {
    listen 80;
    server_name localhost;

    location = / {
        return 302 http://localhost:8081/apps;
    }

    location = /console {
        return 302 http://localhost:8081/apps;
    }

    location /apps {
        return 302 http://localhost:8081$request_uri;
    }

    location /app/ {
        return 302 http://localhost:8081$request_uri;
    }

    location /datasets {
        return 302 http://localhost:8081$request_uri;
    }

    location /tools {
        return 302 http://localhost:8081$request_uri;
    }

    location /signin {
        return 302 http://localhost:8081$request_uri;
    }

    location /v1/ {
        proxy_pass http://dify-api:5001/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://dify-api:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8081;
    server_name localhost;

    # Redirect the discover entry to the official marketplace so the
    # console menu still works when the browser mishandles the external jump.
    location = /plugins {
        if ($arg_category = discover) {
            return 302 https://marketplace.dify.ai;
        }

        proxy_pass http://dify-web:3000/plugins;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://dify-web:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /console/api/ {
        proxy_pass http://dify-api:5001/console/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://dify-api:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
